<!DOCTYPE html>
<html lang="ru">
<head>
  <script src="/config.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css">
  <script>
  (function() {
        const token = localStorage.getItem('broneboxtoken');
        if (token) {
            window.location.href = '/crm'; 
        }
    })();
  </script>
</head>
<body>

<div class="auth-card">

  <div class="logo">
    <div class="logo-box">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <circle cx="13" cy="13" r="10" stroke="rgba(255,255,255,0.55)" stroke-width="0.8"/>
        <circle cx="13" cy="13" r="6.5" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" stroke-dasharray="2 1.6"/>
        <circle cx="13" cy="13" r="3" stroke="rgba(255,255,255,0.5)" stroke-width="0.8"/>
        <circle cx="13" cy="13" r="1.2" fill="rgba(255,255,255,0.5)"/>
      </svg>
    </div>
  </div>

  <h1>С возвращением</h1>
  <p class="subtitle">Введите данные для входа</p>

  <div class="fields">
    <div class="field">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
      </svg>
      <input id="login" type="login" placeholder="Логин" autocomplete="login" />
    </div>
    <div class="field">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <input id="password" type="password" placeholder="Пароль" autocomplete="current-password" />
    </div>
  </div>

  <div class="forgot-row">
    <span class="forgot" onclick="alert('Обратитесь к администратору, чтобы поменять пароль')">Забыли пароль?</span>
  </div>

  <button class="btn-primary" id="btn-login" onclick="handleLogin()">Войти</button>

  <p class="error-msg" id="error">Заполните все поля</p>

  <div class="toast" id="toast">Добро пожаловать! Вход выполнен.</div>

</div>

<script>
  async function handleLogin() {
    const login = document.getElementById('login').value.trim();
    const pass = document.getElementById('password').value;
    const btn = document.getElementById('btn-login');
    const error = document.getElementById('error');
    const toast = document.getElementById('toast');

    error.classList.remove('show');

    if (!login || !pass) {
      error.textContent = 'Заполните все поля';
      error.classList.add('show');
      return;
    }

    btn.textContent = 'Вход...';
    btn.disabled = true;

    try {
      const res = await fetch(API + '/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login, password: pass })
      });

      const data = await res.json();

      if (!res.ok) {
        error.textContent = data.error || 'Ошибка входа';
        error.classList.add('show');
        return;
      }

      localStorage.setItem('broneboxtoken', data.token);

      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);

      window.location.href = '/crm';

    } catch (err) {
      error.textContent = 'Не удалось подключиться к серверу';
      error.classList.add('show');
    } finally {
      btn.textContent = 'Войти';
      btn.disabled = false;
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLogin();
  });
</script>

</body>
</html>
