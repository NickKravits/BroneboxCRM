<!DOCTYPE html>
<html lang="ru">
<head>
    <script>
  // Мгновенная проверка токена до загрузки интерфейса
  (function() {
        const token = localStorage.getItem('broneboxtoken');
        if (!token) {
            // Если токена нет, отправляем на страницу входа
            localStorage.removeItem('broneboxtoken');
            window.location.href = '/login'; 
        }
    })();
  </script>

  <script>
    async function getUserData() {
      const token = localStorage.getItem('broneboxtoken');
      if (!token) {
        window.location.href = '/login';
        return;
      }
      try {
        const res = await fetch('http://127.0.0.1:3000/users/getme', {
            method: 'GET',
            headers: {
                'Authorization': `Bearer ${token}`, // Передаем токен бэкенду
                'Content-Type': 'application/json'
            }
        });

        if (!res.ok) {
            localStorage.removeItem('broneboxtoken');
            window.location.href = '/login';
        }

        const data = await res.json();

        let role = "";

        if (data.role == 'ADMINISTRATOR') {
            role = 'Администратор';
        } else if (data.role == 'STAFF') {
            role = 'Менеджер';
        } else {
            role = 'Неизвестная роль';
        }

        const initials = data.name ? data.name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2) : '??';

        document.querySelector('.avatar-name').textContent = data.name || 'Без имени';
        document.querySelector('.avatar-role').textContent = role;
        document.getElementById('main_avatar').textContent = initials;
      } catch (err) {
        console.error('Ошибка при получении данных пользователя:', err);
      }
    }

    async function getBookings() {
  const token = localStorage.getItem('broneboxtoken');

  const data = await fetch('http://127.0.0.1:3000/users/getme', {
            method: 'GET',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            }
        });

    if (!data.ok) {
      console.error('Ошибка при получении таймзоны:', res.statusText);
      return;
    }

    const dataRes = await data.json();
    
    const userTimezone = dataRes.cabinet.Timezone || 'Europe/Moscow';

  const today = new Date();
  const todayStr = new Intl.DateTimeFormat('en-CA', {
    timeZone: userTimezone,
    year: 'numeric',
    month: '2-digit',
    day: '2-digit'
}).format(today);

  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  const tomorrowStr = new Intl.DateTimeFormat('en-CA', {
    timeZone: userTimezone,
    year: 'numeric',
    month: '2-digit',
    day: '2-digit'
  }).format(tomorrow);

  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const yesterdayStr = new Intl.DateTimeFormat('en-CA', {
    timeZone: userTimezone,
    year: 'numeric',
    month: '2-digit',
    day: '2-digit'
  }).format(yesterday);

  let counter = 0;

  let counterTomorowIn = 0;
  let counterTodayIn = 0;
  let counterLiving = 0;
  let counterTodayOut = 0;
  let counterTomorrowOut = 0;

  const tomorrowInContainer = document.getElementById('tomorrow-in-container');
  const todayInContainer = document.getElementById('today-in-container');
  const livingContainer = document.getElementById('living-container');
  const todayOutContainer = document.getElementById('today-out-container');
  const tomorrowOutContainer = document.getElementById('tomorrow-out-container');

  tomorrowInContainer.innerHTML = '';
  todayInContainer.innerHTML = '';
  livingContainer.innerHTML = '';
  todayOutContainer.innerHTML = '';
  tomorrowOutContainer.innerHTML = '';

  try {
    const res = await fetch('http://127.0.0.1:3000/bookings/get', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({})
    });

    if (!res.ok) {
      console.error('Ошибка при получении бронирований:', res.statusText);
      return;
    }

    const { bookings } = await res.json();

    for (const booking of bookings) {
      const getObj = await fetch('http://127.0.0.1:3000/objects/getbyrid', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ rId: booking.realty_id })
      });

      const { object } = await getObj.json();

      const beginStr = booking.begin_date.split('T')[0];
      const endStr = booking.end_date.split('T')[0];

      const card = document.createElement('div');
      card.className = 'guest-card';

      // Завтра заезд
      if (beginStr === tomorrowStr) {
        counterTomorowIn++
        card.innerHTML = `
          <div class="card-header-row">
            <div class="guest-name">${booking.fio}</div>
            <span class="booking-source">${booking.source}</span>
          </div>
          <div class="guest-room">${object.name}</div>
          <div class="guest-dates">
            Заезд: ${formatDate(booking.begin_date)}
            (${booking.begin_time
              ? `<span class="tm-confirmed">${booking.begin_time}</span>`
              : `<span class="tm-unconfirmed">${object.checkindef}</span>`})
          </div>
          <div class="card-tags-group">
            <span class="guest-tag">${nightsCount(booking.begin_date, booking.end_date)} ночей</span>
          </div>
          ${booking.channel == " " || booking.channel === "" ? '' : `<div class="card-footer-row">
            <span class="channel-tag">${booking.channel}</span>
          </div>`}
        `;
        tomorrowInContainer.appendChild(card);

      // Сегодня заезд
      } else if (beginStr === todayStr) {
        counterTodayIn++
        card.innerHTML = `
          <div class="card-header-row">
            <div class="guest-name">${booking.fio}</div>
            <span class="booking-source">${booking.source}</span>
          </div>
          <div class="guest-room">${object.name}</div>
          <div class="guest-dates">
            Заезд: ${formatDate(booking.begin_date)}
            (${booking.begin_time
              ? `<span class="tm-confirmed">${booking.begin_time}</span>`
              : `<span class="tm-unconfirmed">${object.checkindef}</span>`})
          </div>
          <div class="card-tags-group">
            <span class="guest-tag">${nightsCount(booking.begin_date, booking.end_date)} ночей</span>
          </div>
          ${booking.channel == " " || booking.channel === "" ? '' : `<div class="card-footer-row">
            <span class="channel-tag">${booking.channel}</span>
          </div>`}
        `;
        todayInContainer.appendChild(card);

      // Сегодня выезд
      } else if (endStr === todayStr) {
        counterTodayOut++
        card.innerHTML = `
          <div class="card-header-row">
            <div class="guest-name">${booking.fio}</div>
            <span class="booking-source">${booking.source}</span>
          </div>
          <div class="guest-room">${object.name}</div>
          <div class="guest-dates">
            Выезд: ${formatDate(booking.end_date)}
            (${booking.end_time
              ? `<span class="tm-confirmed">${booking.end_time}</span>`
              : `<span class="tm-unconfirmed">${object.checkoutdef}</span>`})
          </div>
          <div class="card-tags-group">
            <span class="guest-tag">${nightsCount(booking.begin_date, booking.end_date)} ночей</span>
          </div>
          ${booking.channel == " " || booking.channel === "" ? '' : `<div class="card-footer-row">
            <span class="channel-tag">${booking.channel}</span>
          </div>`}
        `;
        todayOutContainer.appendChild(card);

      // Завтра выезд
      } else if (endStr === tomorrowStr) {
        counterTomorrowOut++
        card.innerHTML = `
          <div class="card-header-row">
            <div class="guest-name">${booking.fio}</div>
            <span class="booking-source">${booking.source}</span>
          </div>
          <div class="guest-room">${object.name}</div>
          <div class="guest-dates">
            Выезд: ${formatDate(booking.end_date)}
            (${booking.end_time
              ? `<span class="tm-confirmed">${booking.end_time}</span>`
              : `<span class="tm-unconfirmed">${object.checkoutdef}</span>`})
          </div>
          <div class="card-tags-group">
            <span class="guest-tag">${nightsCount(booking.begin_date, booking.end_date)} ночей</span>
          </div>
          ${booking.channel == " " || booking.channel === "" ? '' : `<div class="card-footer-row">
            <span class="channel-tag">${booking.channel}</span>
          </div>`}
        `;
        tomorrowOutContainer.appendChild(card);

      // Живут (заезд был раньше сегодня, выезд позже сегодня)
      } else if (beginStr <= todayStr && endStr > todayStr) {
        counterLiving++
        card.innerHTML = `
          <div class="card-header-row">
            <div class="guest-name">${booking.fio}</div>
            <span class="booking-source">${booking.source}</span>
          </div>
          <div class="guest-room">${object.name}</div>
          <div class="guest-dates">
            ${formatDate(booking.begin_date)} — ${formatDate(booking.end_date)}
          </div>
          <div class="card-tags-group">
            <span class="guest-tag">${nightsCount(booking.begin_date, booking.end_date)} ночей</span>
          </div>
          ${booking.channel == " " || booking.channel === "" ? '' : `<div class="card-footer-row">
            <span class="channel-tag">${booking.channel}</span>
          </div>`}
        `;
        livingContainer.appendChild(card);
      }

      if (beginStr <= todayStr && endStr > todayStr) {
        counter++
      } else if (beginStr >= tomorrowStr) {
        counter++
      }
    }

    document.getElementById('num-container').textContent = counter
    document.getElementById('col-count-tomorrow-in').textContent = counterTomorowIn
    document.getElementById('col-count-today-in').textContent = counterTodayIn
    document.getElementById('col-count-living').textContent = counterLiving
    document.getElementById('col-count-today-out').textContent = counterTodayOut
    document.getElementById('col-count-tomorrow-out').textContent = counterTomorrowOut

  } catch (err) {
    console.error('Ошибка при получении бронирований:', err);
  }

  
}

function formatDate(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
}

    function nightsCount(begin, end) {
        return (new Date(end) - new Date(begin)) / 86400000
    }

    async function getAvailableObjects() {
      const token = localStorage.getItem('broneboxtoken');
      const availableDiv = document.getElementById('section-title');
      const availableList = document.getElementById("objects-list")
      availableList.innerHTML = '';

      try {
        const res = await fetch('http://127.0.0.1:3000/objects/check-availability', {
          method: 'GET',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
        });

        if (!res.ok) {
          console.error('Ошибка при получении объектов:', res.statusText);
          return;
        }

        const { AvailableObjects } = await res.json();
        
        

        if (AvailableObjects.length === 0) {
          availableList.remove();
          availableDiv.remove();
          return;
        }
        for (const object of AvailableObjects) {
          const card = document.createElement('div');
          card.className = 'object-row';
          card.innerHTML = `
            <div>
              <div class="object-name">${object.name}</div>
              <div class="object-meta">${object.location}</div>
            </div>
            <span class="badge-warn">Не сдан</span>
            `;
          availableList.appendChild(card);
        }

      } catch (err) {
        console.error('Ошибка при получении объектов:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', () => { 
      getUserData();
      getBookings();
      getAvailableObjects();
    });
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BroneBox CRM - Главная</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="ambient ambient-tr"></div>
<div class="ambient ambient-bl"></div>

<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
  <div class="avatar-wrap">
    <div class="avatar">
      <div class="person-avatar" id="main_avatar"></div>
    </div>
    <div class="avatar-info">
      <span class="avatar-name">...</span>
      <span class="avatar-role"></span>
    </div>
  </div>

  <nav class="nav-items">
    <a class="nav-item active" href="#">
      <i class="ti ti-layout-dashboard" aria-hidden="true"></i>
      <span class="nav-label">Главное</span>
    </a>
    <a class="nav-item" href="/crm/bookings">
      <i class="ti ti-calendar-event" aria-hidden="true"></i>
      <span class="nav-label">Бронирования</span>
    </a>
    <a class="nav-item" href="/crm/logs">
      <i class="ti ti-info-circle" aria-hidden="true"></i>
      <span class="nav-label">Логи</span>
    </a>
    <a class="nav-item" href="/crm/settings">
      <i class="ti ti-settings-2" aria-hidden="true"></i>

  <div class="sidebar-bottom">

      <i class="ti ti-chevrons-right" aria-hidden="true"></i>
      <span class="toggle-label">Свернуть</span>
    </div>
  </div>
</aside>

  <!-- Main -->
  <main class="main">

    <!-- Top row -->
    <div class="top-row">
      <div class="stat-pill">
        <span class="num" id="num-container">...</span>
        <span class="lbl">будущие брони</span>
      </div>
    </div>

    <!-- Kanban -->
    <div class="columns-row">

      <!-- Завтра заезд -->
        <div>
            <div class="col-header">
                <span class="col-dot" style="background:var(--accent-amber)"></span>
                Завтра заезд
                <span class="col-count" id="col-count-tomorrow-in">...</span>
            </div>
            <div id="tomorrow-in-container">
            </div>
        </div>

      <!-- Сегодня заезд -->
        <div>
            <div class="col-header">
                <span class="col-dot" style="background:var(--accent-blue)"></span>
                Сегодня заезд
                <span class="col-count" id="col-count-today-in">...</span>
                <div id="today-in-container"></div>
            </div>
      </div>


      <!-- Живут -->
      <div>
        <div class="col-header">
          <span class="col-dot" style="background:var(--accent-green)"></span>
          Живут
          <span class="col-count" id="col-count-living">...</span>
        </div>
        <div id="living-container">
        </div>
      </div>

      <!-- Сегодня выезд -->
      <div>
        <div class="col-header">
          <span class="col-dot" style="background:var(--accent-orange)"></span>
          Сегодня выезд
          <span class="col-count" id="col-count-today-out">...</span>
        </div>
        <div id="today-out-container">
        </div>
      </div>

      <!-- Завтра выезд -->
      <div>
        <div class="col-header">
          <span class="col-dot" style="background:var(--accent-gray)"></span>
          Завтра выезд
          <span class="col-count" id="col-count-tomorrow-out">...</span>
        </div>
        <div id="tomorrow-out-container">
        </div>
      </div>

    </div>

    <!-- Unsurrendered objects -->
    <div class="section-title" id="section-title">Несданные объекты сегодня</div>
    <div class="objects-list" id="objects-list">
    </div>

  </main>
</div>

<script>
  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
  }
</script>

</body>
