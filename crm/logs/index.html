      </a>
      <a class="nav-item" href="/crm/bookings">
        <i class="ti ti-calendar-event" aria-hidden="true"></i>

    <div class="sidebar-bottom">

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
    let readQueue    = new Set();  // ID логов к отправке
    let flushTimeout = null;

    function scheduleFlush() {
        if (flushTimeout) return;
        flushTimeout = setTimeout(flushReadQueue, 300); // батч раз в секунду
    }

    async function flushReadQueue() {
        flushTimeout = null;
        if (readQueue.size === 0) return;

        const ids = [...readQueue];
        readQueue.clear();

        try {
            const token = localStorage.getItem('broneboxtoken');
            const res = await fetch(`${API}/logs/read`, {
                method: 'PATCH',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ ids }),
                keepalive: true  // ← вот это спасёт запрос при обновлении
            });

            if (!res.ok) {
                // Если сервер вернул ошибку — возвращаем ID обратно в очередь
                ids.forEach(id => readQueue.add(id));
                console.error('Ошибка отметки логов:', res.status);
            }
        } catch (err) {
            ids.forEach(id => readQueue.add(id));
            console.error('Ошибка отметки логов:', err);
        }
    }

    function observeUnreadLogs() {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const row = entry.target;

                if (!entry.isIntersecting) {
                    if (row._readTimer) {
                        clearTimeout(row._readTimer);
                        row._readTimer = null;
                    }
                    return;
                }

                const id = Number(row.dataset.id);
                row._readTimer = setTimeout(() => {
                    if (!document.contains(row)) return;
                    row.querySelector('.log-unread-dot').style.visibility = 'hidden';
                    row.classList.remove('unread');
                    readQueue.add(id);
                    scheduleFlush();
                    observer.unobserve(row);
                    updateUnreadPill();
                }, 600);
            });
        }, { threshold: 0.5 });

        document.querySelectorAll('.log-row.unread').forEach(row => {
            observer.observe(row);
        });
    }

    function updateUnreadPill() {
        const pill        = document.getElementById('unread-pill');
        const unreadCount = document.querySelectorAll('.log-row.unread').length;

        if (unreadCount > 0) {
            pill.textContent = `${unreadCount} непрочитанных`;
            pill.style.display = '';
        } else {
            pill.style.display = 'none';
        }
    }

    window.addEventListener('beforeunload', () => {
        if (readQueue.size === 0) return;
            const token = localStorage.getItem('broneboxtoken');
            // keepalive: true — запрос завершится даже после закрытия/обновления страницы
            fetch(`${API}/logs/read`, {
                method: 'PATCH',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ ids: [...readQueue] }),
                keepalive: true
        });
    });
</script>
<script>
  

  const STATUS_CONFIG = {
    INFO:    { icon: 'ti-info-circle',  cls: 'info',    label: 'Инфо' },
    ERROR:   { icon: 'ti-alert-circle', cls: 'error',   label: 'Ошибка' },
    SUCCESS: { icon: 'ti-circle-check', cls: 'success', label: 'Успешно' }
  };

  function formatDate(str) {
    const d = new Date(str);
    return d.toLocaleString('ru-RU', {
      day:    'numeric',
      month:  'long',
      year:   'numeric',
      hour:   '2-digit',
      minute: '2-digit'
    });
  }

  function renderLogRow(log) {
    const cfg     = STATUS_CONFIG[log.status] ?? STATUS_CONFIG.INFO;
    const isUnread = log.readed === 'NO';

    return `
      <div class="log-row${isUnread ? ' unread' : ''}" data-id="${log.id}">
        <div class="log-unread-dot"></div>
        <div class="log-status-icon log-status-icon--${cfg.cls}">
          <i class="ti ${cfg.icon}"></i>
        </div>
        <div class="log-content">
          <div class="log-message">${escapeHtml(log.message)}</div>
          <div class="log-date">${formatDate(log.date)}</div>
        </div>
        <span class="log-badge log-badge--${cfg.cls}">${cfg.label}</span>
      </div>
    `;
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function renderEmpty() {
    return `
      <div class="empty-state">
        <i class="ti ti-clipboard-off"></i>
        <div class="empty-state-title">Логов пока нет</div>
        <div class="empty-state-desc">События из интеграций и системы будут отображаться здесь</div>
      </div>
    `;
  }

  async function loadLogs() {
    const token = localStorage.getItem('broneboxtoken');
    const container = document.getElementById('logs-container');
    const subtitle  = document.getElementById('logs-subtitle');
    const pill      = document.getElementById('unread-pill');

    try {
      const res = await fetch(`${API}/logs/get`, {
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        }
      });

      if (!res.ok) {
        subtitle.textContent = 'Не удалось загрузить логи';
        container.innerHTML  = renderEmpty();
        return;
      }

      const { logs } = await res.json();

      if (!logs || logs.length === 0) {
        subtitle.textContent = 'Нет записей';
        container.innerHTML  = renderEmpty();
        return;
      }

      const unreadCount = logs.filter(l => l.readed === 'NO').length;

      subtitle.textContent = `${plural(logs.length, 'запись', 'записи', 'записей')}`;

      if (unreadCount > 0) {
        pill.textContent  = `${unreadCount} непрочитанных`;
        pill.classList.add('has-unread');
        pill.style.display = '';
      }

      container.innerHTML = `<div class="logs-list">${logs.map(renderLogRow).join('')}</div>`;
      observeUnreadLogs();

    } catch (err) {
      console.error('Ошибка при загрузке логов:', err);
      subtitle.textContent = 'Ошибка загрузки';
      container.innerHTML  = renderEmpty();
    }
  }

  // Склонение числительных
  function plural(n, one, few, many) {
    const mod10  = n % 10;
    const mod100 = n % 100;
    if (mod100 >= 11 && mod100 <= 19) return `${n} ${many}`;
    if (mod10 === 1)                   return `${n} ${one}`;
    if (mod10 >= 2 && mod10 <= 4)     return `${n} ${few}`;
    return `${n} ${many}`;
  }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
  }

  async function getUserData() {
    const token = localStorage.getItem('broneboxtoken');
    if (!token) { window.location.href = '/login'; return; }
    try {
      const res = await fetch(`${API}/users/getme`, {
        method: 'GET',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        }
      });
      if (!res.ok) {
        localStorage.removeItem('broneboxtoken');
        window.location.href = '/login';
        return;
      }
      const data = await res.json();
      const roleMap  = { ADMINISTRATOR: 'Администратор', STAFF: 'Менеджер' };
      const initials = data.name
        ? data.name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2)
        : '??';
      document.querySelector('.avatar-name').textContent = data.name || 'Без имени';
      document.querySelector('.avatar-role').textContent = roleMap[data.role] || 'Неизвестная роль';
      document.getElementById('main_avatar').textContent = initials;
    } catch (err) {
      console.error('Ошибка при получении данных пользователя:', err);
    }
  }

  document.addEventListener('DOMContentLoaded', async () => {
    try {
      await Promise.all([getUserData(), loadLogs()]);
    } finally {
      const loader = document.getElementById('page-loader');
      loader.classList.add('hidden');
      setTimeout(() => loader.remove(), 300);
    }
  });
</script>
<script src="app-shell.js"></script>
</body>
</html>
